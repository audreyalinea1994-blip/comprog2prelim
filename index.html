<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C# Programming 2 Course</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }

    * {
      font-family: 'Poppins', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #0d1b2a 0%, #1a1f36 50%, #16213e 100%);
    }

    .card-gradient {
      background: linear-gradient(145deg, rgba(26, 31, 54, 0.8), rgba(13, 27, 42, 0.9));
      backdrop-filter: blur(10px);
    }

    .code-block {
      background: linear-gradient(135deg, #1e1e1e 0%, #2d2d30 100%);
      border-left: 4px solid #0ea5e9;
    }

    .week-tab {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .week-tab:hover {
      transform: translateY(-2px);
    }

    .week-tab.active {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
    }

    .section-btn {
      transition: all 0.2s ease;
    }

    .section-btn:hover {
      transform: scale(1.02);
    }

    .section-btn.active {
      background: rgba(14, 165, 233, 0.2);
      border-color: #0ea5e9;
    }

    .quiz-option {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .quiz-option:hover:not(.selected):not(.correct):not(.incorrect) {
      background: rgba(14, 165, 233, 0.1);
      border-color: #0ea5e9;
    }

    .quiz-option.selected {
      background: rgba(14, 165, 233, 0.2);
      border-color: #0ea5e9;
    }

    .quiz-option.correct {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
    }

    .quiz-option.incorrect {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
    }

    .progress-bar {
      background: linear-gradient(90deg, #0ea5e9, #06b6d4, #14b8a6);
      transition: width 0.5s ease;
    }

    .keyword { color: #569cd6; font-weight: 600; }
    .type { color: #4ec9b0; }
    .string { color: #ce9178; }
    .comment { color: #6a9955; }
    .number { color: #b5cea8; }

    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    .slide-up {
      animation: slideUp 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1f36;
    }

    ::-webkit-scrollbar-thumb {
      background: #0ea5e9;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #06b6d4;
    }

    .highlight-line {
      background: rgba(14, 165, 233, 0.1);
      border-left: 3px solid #0ea5e9;
      padding-left: 12px;
    }

    .syntax-highlighter {
      overflow-x: auto;
    }

    .line-number {
      color: #6a7280;
      user-select: none;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full gradient-bg text-slate-100 overflow-auto">

     <p class="text-slate-400 text-sm">💻 C# Programming 2 • Object-Oriented Design • Information Systems</p>

  <script>
    // Course Data

        {

          ],
          content: {
            overview: `
              <h3 class="text-2xl font-bold text-white mb-6">📌 Week 1: Review of Programming Fundamentals</h3>
              
              <div class="space-y-6">
                <div class="card-gradient rounded-2xl p-6 border border-slate-600/30">
                  <h4 class="text-lg font-semibold text-cyan-400 mb-3">🔄 Review of Programming 1 Concepts</h4>
                  <p class="text-slate-300 leading-relaxed mb-4">
                    Before diving into Object-Oriented Programming, let's review the fundamental concepts from Programming 1 that form the foundation of C#.

                        <li><span class="keyword">if/else</span> statements</li>
                        <li><span class="keyword">for</span>, <span class="keyword">while</span> loops</li>
                        <li><span class="keyword">switch</span> statements</li>
                      </ul>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4">

                        <li>Arithmetic (+, -, *, /)</li>

                  <h4 class="text-lg font-semibold text-cyan-400 mb-3">💡 Problem Solving and Algorithm Refinement</h4>
                  <p class="text-slate-300 mb-4">
                    Good programming starts with good problem-solving skills. Let's review the process:

                  <div class="space-y-3">

                      <p class="text-xs text-slate-400">Break into smaller steps, create pseudocode</p>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 border-l-4 border-cyan-500">
                      <p class="text-sm text-white font-semibold mb-1">3️⃣ Write the Code</p>
                      <p class="text-xs text-slate-400">Implement the algorithm step by step</p>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 border-l-4 border-cyan-500">
                      <p class="text-sm text-white font-semibold mb-1">4️⃣ Test and Debug</p>
                      <p class="text-xs text-slate-400">Verify with test cases, fix errors</p>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 border-l-4 border-cyan-500">
                      <p class="text-sm text-white font-semibold mb-1">5️⃣ Optimize</p>
                      <p class="text-xs text-slate-400">Improve efficiency and readability</p>
                    </div>
                  </div>
                </div>

                <div class="card-gradient rounded-2xl p-6 border border-slate-600/30">
                  <h4 class="text-lg font-semibold text-cyan-400 mb-3">🔧 Functions and Modular Programming</h4>
                  <p class="text-slate-300 mb-4">
                    Functions allow us to break programs into reusable, manageable pieces.
                  </p>

                  <div class="bg-slate-900/50 rounded-xl p-4 mb-4 code-block">
                    <p class="text-xs text-slate-400 mb-2 mono">// Function structure in C#</p>
                    <div class="space-y-1 text-sm mono">
                      <span class="keyword">public static</span> <span class="type">int</span> <span class="text-white">Add</span>(<span class="type">int</span> <span class="text-white">a</span>, <span class="type">int</span> <span class="text-white">b</span>)</span>

                      <span class="text-white">}</span>
                    </div>
                  </div>

                  <div class="grid md:grid-cols-2 gap-4">
                    <div class="bg-slate-800/50 rounded-xl p-4">
                      <h5 class="font-semibold text-white mb-2">Function Components</h5>
                      <ul class="space-y-2 text-sm text-slate-300">
                        <li>• <strong>Return Type:</strong> What the function returns</li>
                        <li>• <strong>Function Name:</strong> Descriptive identifier</li>
                        <li>• <strong>Parameters:</strong> Inputs to the function</li>
                        <li>• <strong>Body:</strong> The code logic</li>
                      </ul>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4">
                      <h5 class="font-semibold text-white mb-2">Benefits of Modular Code</h5>
                      <ul class="space-y-2 text-sm text-slate-300">
                        <li>✓ Code Reusability</li>
                        <li>✓ Easier Testing</li>
                        <li>✓ Better Readability</li>
                        <li>✓ Simplified Debugging</li>
                      </ul>
                    </div>
                  </div>
                </div>

                <div class="bg-gradient-to-r from-cyan-900/50 to-blue-900/50 rounded-2xl p-6 border border-cyan-500/30">
                  <h4 class="text-lg font-semibold text-white mb-3">💡 Key Takeaways</h4>
                  <ul class="space-y-2 text-slate-300">
                    <li>• Data types and variables are fundamental to all programs</li>
                    <li>• Control flow structures organize program logic</li>
                    <li>• Functions break code into manageable, reusable pieces</li>
                    <li>• Good problem-solving leads to clean, efficient code</li>
                  </ul>
                </div>
              </div>
            `,
            activity: `
              <h3 class="text-2xl font-bold text-white mb-6">🎮 Week 1 Activity: Code Analysis and Improvement</h3>
              
              <div class="card-gradient rounded-2xl p-6 border border-slate-600/30 mb-6">
                <h4 class="text-lg font-semibold text-cyan-400 mb-4">Instructions</h4>

                <div class="bg-slate-800/50 rounded-xl p-4 code-block mb-4">

                    <span class="keyword">public static void</span> <span class="text-white">Main()</span></span>
                    <span class="text-white">{</span>
                    <span class="highlight-line"><span class="keyword">int</span> <span class="text-white">num1 = 5, num2 = 3;</span></span>
                    <span><span class="keyword">int</span> <span class="text-white">sum = num1 + num2;</span></span>
                    <span><span class="keyword">int</span> <span class="text-white">product = num1 * num2;</span></span>
                    <span><span class="keyword">int</span> <span class="text-white">quotient = num1 / num2;</span></span>
                    <span class="text-white">}</span>
                  </div>
                </div>

                <div class="grid md:grid-cols-2 gap-4 mb-6">
                  <div>
                    <p class="text-sm font-semibold text-white mb-3">What's the issue?</p>
                    <div class="space-y-2" id="issue-options">
                      <button onclick="selectAnswer(this, 'issue', 'repetition')" class="w-full text-left px-4 py-2 bg-slate-700/50 rounded-lg hover:bg-slate-600/50 transition-all text-sm activity-option">
                        📌 Repetitive calculations in Main method
                      </button>
                      <button onclick="selectAnswer(this, 'issue', 'naming')" class="w-full text-left px-4 py-2 bg-slate-700/50 rounded-lg hover:bg-slate-600/50 transition-all text-sm activity-option">
                        📌 Poor variable naming
                      </button>
                      <button onclick="selectAnswer(this, 'issue', 'nofunctions')" class="w-full text-left px-4 py-2 bg-slate-700/50 rounded-lg hover:bg-slate-600/50 transition-all text-sm activity-option">
                        📌 No use of functions/modules
                      </button>
                    </div>
                  </div>
                  <div>
                    <p class="text-sm font-semibold text-white mb-3">Best improvement?</p>
                    <div class="space-y-2" id="solution-options">
                      <button onclick="selectAnswer(this, 'solution', 'create')" class="w-full text-left px-4 py-2 bg-slate-700/50 rounded-lg hover:bg-slate-600/50 transition-all text-sm activity-option">
                        ✨ Create helper functions for calculations
                      </button>
                      <button onclick="selectAnswer(this, 'solution', 'comments')" class="w-full text-left px-4 py-2 bg-slate-700/50 rounded-lg hover:bg-slate-600/50 transition-all text-sm activity-option">
                        ✨ Add comments to the code
                      </button>
                      <button onclick="selectAnswer(this, 'solution', 'arrays')" class="w-full text-left px-4 py-2 bg-slate-700/50 rounded-lg hover:bg-slate-600/50 transition-all text-sm activity-option">
                        ✨ Use arrays to store values
                      </button>
                    </div>
                  </div>
                </div>

                <div id="activity-feedback" class="hidden">
                  <div class="bg-green-900/30 rounded-xl p-4 border border-green-500/30">
                    <p class="text-green-400 font-semibold">✓ Correct! Breaking code into functions improves reusability.</p>
                  </div>
                </div>

                <button onclick="checkActivityAnswers()" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-medium transition-all mr-3">
                  ✓ Check Answer
                </button>
                <button onclick="resetActivityAnswers()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-medium transition-all">
                  🔄 Reset
                </button>
              </div>
            `,
            quiz: [
              {
                question: "Which of the following is NOT a step in the problem-solving process?",

                  "Test and debug"

                correct: 1,
                explanation: "The main steps are: Understand, Plan, Write Code, Test/Debug, and Optimize. Creating a database is not part of the core problem-solving process."
              },
              {

                options: [
                  "Functions make code run faster",
                  "Functions allow code reusability and modularity",
                  "Functions reduce memory usage",
                  "Functions eliminate all bugs"

                correct: 1,
                explanation: "Functions allow us to break code into manageable, reusable pieces, improving code organization and maintainability."
              },
              {
                question: "In C#, what keyword is used to return a value from a function?",
                options: [
                  "exit",
                  "return",
                  "yield",
                  "break"
                ],
                correct: 1,
                explanation: "The 'return' keyword is used to return a value from a function in C#."
              },
              {
                question: "Which data type would be best for storing a temperature value like 98.6?",
                options: [
                  "int",

                  "bool",
                  "double"

                correct: 3,

        {

            "OOP Concepts",

            "Attributes and Methods"
          ],
          content: {
            overview: `
              <h3 class="text-2xl font-bold text-white mb-6">📌 Week 2: Introduction to Object-Oriented Programming (OOP)</h3>
              
              <div class="space-y-6">
                <div class="card-gradient rounded-2xl p-6 border border-slate-600/30">
                  <h4 class="text-lg font-semibold text-cyan-400 mb-3">🌍 OOP Concepts</h4>

                    Object-Oriented Programming is a paradigm that uses "objects" and "classes" to structure code in a more intuitive, modular way.
                  </p>
                  
                  <div class="space-y-3">
                    <div class="bg-slate-800/50 rounded-xl p-4">

                          <p class="text-slate-400 text-xs mt-1">Bundling data and methods together</p>
                        </div>
                        <div class="border-l-2 border-cyan-500 pl-3">
                          <p class="font-semibold text-cyan-400">Inheritance</p>
                          <p class="text-slate-400 text-xs mt-1">Classes inherit from other classes</p>
                        </div>
                        <div class="border-l-2 border-cyan-500 pl-3">
                          <p class="font-semibold text-cyan-400">Polymorphism</p>
                          <p class="text-slate-400 text-xs mt-1">Objects behave differently based on context</p>
                        </div>
                        <div class="border-l-2 border-cyan-500 pl-3">
                          <p class="font-semibold text-cyan-400">Abstraction</p>
                          <p class="text-slate-400 text-xs mt-1">Hide complex implementation details</p>

                    </div>
                  </div>
                </div>

                <div class="card-gradient rounded-2xl p-6 border border-slate-600/30">
                  <h4 class="text-lg font-semibold text-cyan-400 mb-3">📦 Classes and Objects</h4>
                  <p class="text-slate-300 mb-4">
                    A <strong class="text-white">class</strong> is a blueprint, and an <strong class="text-white">object</strong> is an instance of that blueprint.
                  </p>

                  <div class="bg-slate-900/50 rounded-xl p-4 mb-4 code-block">
                    <p class="text-xs text-slate-400 mb-2 mono">// Class definition</p>
                    <div class="space-y-1 text-sm mono">
                      <span class="keyword">public class</span> <span class="type">Car</span></span>
                      <span class="text-white">{</span>
                      <span class="keyword">&nbsp;&nbsp;public string</span> <span class="text-white">Brand { get; set; }</span></span>
                      <span class="keyword">&nbsp;&nbsp;public int</span> <span class="text-white">Year { get; set; }</span></span>
                      <span class="text-white">}</span>
                      <br>
                      <span class="comment">// Creating objects (instances)</span>
                      <span class="type">Car</span> <span class="text-white">myCar = new</span> <span class="type">Car</span><span class="text-white">();</span>
                      <span class="text-white">myCar.Brand = </span><span class="string">"Toyota"</span><span class="text-white">;</span>
                      <span class="text-white">myCar.Year = 2024;</span>
                    </div>
                  </div>

                  <div class="grid md:grid-cols-2 gap-4">
                    <div class="bg-slate-800/50 rounded-xl p-4">
                      <h5 class="font-semibold text-white mb-2">Class Characteristics</h5>
                      <ul class="space-y-2 text-sm text-slate-300">
                        <li>• Blueprint for objects</li>
                        <li>• Defines properties and methods</li>
                        <li>• Never executes directly</li>
                        <li>• Reusable template</li>
                      </ul>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4">
                      <h5 class="font-semibold text-white mb-2">Object Characteristics</h5>
                      <ul class="space-y-2 text-sm text-slate-300">
                        <li>• Instance of a class</li>
                        <li>• Has actual values</li>
                        <li>• Takes up memory</li>
                        <li>• Independent from other objects</li>
                      </ul>
                    </div>
                  </div>
                </div>

                🎮 Activity
              </button>
              <button 
                onclick="showSection('quiz')" 
                class="section-btn px-6 py-3 rounded-xl font-medium transition-all border-2
                  ${currentSection === 'quiz' ? 'active border-cyan-500 text-white' : 'border-slate-600 text-slate-400 hover:text-white'}"
              >
                📝 Quiz
              </button>
            </div>
          </div>
          
          <div id="section-content" class="fade-in">
            ${getSectionContent(week)}
          </div>
        </div>
      `;
      
      // Initialize activity if needed
      if (currentSection === 'activity') {
        initializeActivity(weekId);
      }
    }

    // Show Section
    function showSection(section) {
      currentSection = section;
      loadWeekContent(currentWeek);
    }

    // Get Section Content
    function getSectionContent(week) {
      switch (currentSection) {
        case 'lesson':
          return week.content.overview;
        case 'activity':
          return week.content.activity;
        case 'quiz':
          return renderQuiz(week);
        default:
          return week.content.overview;
      }
    }

    // Initialize Activity
    function initializeActivity(weekId) {
      switch (weekId) {
        case 1:
          // Code analysis activity is click-based
          break;
        case 2:
          initOOPActivity();
          break;
        case 3:
          initModifierActivity();
          break;
        case 4:
          initConstructorActivity();
          break;
        case 5:
          // Inheritance activity initialized via drag
          break;
      }
    }

    // Week 1: Code Activity
    function selectAnswer(el, type, value) {
      if (type === 'issue') {
        document.querySelectorAll('#issue-options button').forEach(b => b.classList.remove('ring-2', 'ring-cyan-400'));
        if (activityAnswers.issue === value) {
          activityAnswers.issue = null;
          el.classList.remove('ring-2', 'ring-cyan-400');
        } else {
          activityAnswers.issue = value;
          el.classList.add('ring-2', 'ring-cyan-400');
        }
      } else if (type === 'solution') {
        document.querySelectorAll('#solution-options button').forEach(b => b.classList.remove('ring-2', 'ring-cyan-400'));
        if (activityAnswers.solution === value) {
          activityAnswers.solution = null;
          el.classList.remove('ring-2', 'ring-cyan-400');
        } else {
          activityAnswers.solution = value;
          el.classList.add('ring-2', 'ring-cyan-400');
        }
      }
    }

    function checkActivityAnswers() {
      const feedback = document.getElementById('activity-feedback');
      if (activityAnswers.issue === 'nofunctions' && activityAnswers.solution === 'create') {
        feedback.classList.remove('hidden');
      } else {
        feedback.innerHTML = `
          <div class="bg-red-900/30 rounded-xl p-4 border border-red-500/30">
            <p class="text-red-400 font-semibold">✗ Not quite right. The issue is lack of functions, and the solution is to create helper functions.</p>
          </div>
        `;
        feedback.classList.remove('hidden');
      }
    }

    function resetActivityAnswers() {
      activityAnswers = { issue: null, solution: null };
      document.querySelectorAll('.activity-option').forEach(b => b.classList.remove('ring-2', 'ring-cyan-400'));
      document.getElementById('activity-feedback').classList.add('hidden');
    }

    // Week 2: OOP Activity
    function initOOPActivity() {
      const items = ['StudentID', 'Name', 'GPA', 'Study()', 'Enroll()', 'Sleep()'];
      const correct = {
        attributes: new Set(['StudentID', 'Name', 'GPA']),
        methods: new Set(['Study()', 'Enroll()', 'Sleep()'])
      };
      
      const container = document.getElementById('oop-items');
      container.innerHTML = items.map(item => `
        <div 
          class="px-4 py-2 bg-slate-700 rounded-lg text-sm cursor-move hover:bg-slate-600 transition-all"
          draggable="true"
          ondragstart="oopDragStart(event)"
          data-item="${item}"
        >
          ${item}
        </div>
      `).join('');
    }

    function oopDragStart(e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', e.target.dataset.item);
    }

    document.addEventListener('dragover', (e) => {
      if (e.target.classList.contains('oop-drop')) {
        e.preventDefault();
        e.target.classList.add('ring-2', 'ring-cyan-400', 'ring-opacity-50');
      }
    });

    document.addEventListener('dragleave', (e) => {
      if (e.target.classList.contains('oop-drop')) {
        e.target.classList.remove('ring-2', 'ring-cyan-400', 'ring-opacity-50');
      }
    });

    document.addEventListener('drop', (e) => {
      const item = e.dataTransfer.getData('text/plain');
      const dropType = e.target.closest('.oop-drop')?.dataset.type;
      
      if (dropType && item) {
        const shouldBeAttribute = ['StudentID', 'Name', 'GPA'].includes(item);
        if ((dropType === 'attributes' && shouldBeAttribute) || (dropType === 'methods' && !shouldBeAttribute)) {
          const dropZone = e.target.closest('.oop-drop');
          const itemEl = `<div class="px-3 py-1 bg-green-700 rounded text-sm">${item} ✓</div>`;
          dropZone.querySelector('p')?.remove();
          dropZone.insertAdjacentHTML('beforeend', itemEl);
          
          const sourceEl = document.querySelector(`[data-item="${item}"]`);
          if (sourceEl) sourceEl.remove();
        }
      }
    });

    function checkOOPAnswers() {
      const attrCount = document.querySelectorAll('#attributes-drop > div.bg-green-700').length;
      const methodCount = document.querySelectorAll('#methods-drop > div.bg-green-700').length;
      
      if (attrCount === 3 && methodCount === 3) {
        document.getElementById('oop-feedback').classList.remove('hidden');
      }
    }

    function resetOOPActivity() {
      initOOPActivity();
      document.getElementById('attributes-drop').innerHTML = '<p class="text-slate-500 text-sm italic">Drop attributes here...</p>';
      document.getElementById('methods-drop').innerHTML = '<p class="text-slate-500 text-sm italic">Drop methods here...</p>';
      document.getElementById('oop-feedback').classList.add('hidden');
    }

    // Week 3: Modifier Activity
    function initModifierActivity() {
      const container = document.getElementById('modifier-activity');
      const items = [
        { member: 'BankAccount.balance (internal data)', correct: 'private' },
        { member: 'BankAccount.Withdraw() (public method)', correct: 'public' },
        { member: 'Animal.Move() (base method for override)', correct: 'protected' },
        { member: 'Logger.Log() (internal helper)', correct: 'private' }
      ];
      
      modifierAnswers = {};
      
      container.innerHTML = items.map((item, i) => `
        <div class="bg-slate-800/50 rounded-xl p-4">
          <p class="text-sm font-semibold text-white mb-3">${item.member}</p>
          <div class="flex gap-2">
            ${['public', 'private', 'protected', 'internal'].map(mod => `
              <button 
                onclick="selectModifier(${i}, '${mod}', this)"
                class="flex-1 px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition-all modifier-btn"
                data-question="${i}"
                data-answer="${mod}"
              >
                ${mod}
              </button>
            `).join('')}
          </div>
          <p class="text-xs text-slate-400 mt-2">Correct: ${item.correct}</p>
        </div>
      `).join('');
    }

    function selectModifier(index, modifier, el) {
      document.querySelectorAll(`[data-question="${index}"]`).forEach(b => b.classList.remove('ring-2', 'ring-cyan-400'));
      el.classList.add('ring-2', 'ring-cyan-400');
      modifierAnswers[index] = modifier;
    }

    function checkModifierAnswers() {
      const correct = { 0: 'private', 1: 'public', 2: 'protected', 3: 'private' };
      let allCorrect = true;
      
      for (let i = 0; i < 4; i++) {
        if (modifierAnswers[i] !== correct[i]) {
          allCorrect = false;
        }
      }
      
      const feedback = document.getElementById('modifier-feedback');
      if (allCorrect) {
        feedback.innerHTML = `<div class="bg-green-900/30 rounded-xl p-4 border border-green-500/30"><p class="text-green-400 font-semibold">✓ Perfect! You understand access modifiers!</p></div>`;
      } else {
        feedback.innerHTML = `<div class="bg-red-900/30 rounded-xl p-4 border border-red-500/30"><p class="text-red-400">Review the answers and try again.</p></div>`;
      }
      feedback.classList.remove('hidden');
    }

    function resetModifierActivity() {
      initModifierActivity();
      document.getElementById('modifier-feedback').classList.add('hidden');
    }

    // Week 4: Constructor Activity
    function initConstructorActivity() {
      const container = document.getElementById('constructor-activity');
      const questions = [
        { code: 'public Student() { }', question: 'Is this a valid default constructor?', correct: true },
        { code: 'public Student(string name) { }', question: 'Can we have multiple constructors?', correct: true },
        { code: 'public int Student() { return 5; }', question: 'Can a constructor have a return type?', correct: false },
        { code: 'public void Add(int a, int b) { } and public void Add(int a, int b) { }', question: 'Are these valid overloads?', correct: false }
      ];
      
      constructorAnswers = {};
      
      container.innerHTML = questions.map((q, i) => `
        <div class="bg-slate-800/50 rounded-xl p-4">
          <div class="bg-slate-900/50 rounded-lg p-3 code-block mono text-xs mb-3 overflow-x-auto">
            ${q.code}
          </div>
          <p class="text-sm font-semibold text-white mb-3">${q.question}</p>
          <div class="flex gap-2">
            <button 
              onclick="selectConstructorAnswer(${i}, true, this)"
              class="flex-1 px-4 py-2 bg-green-900/30 hover:bg-green-800/30 rounded-lg text-sm text-green-400 transition-all const-btn"
              data-question="${i}"
            >
              True
            </button>
            <button 
              onclick="selectConstructorAnswer(${i}, false, this)"
              class="flex-1 px-4 py-2 bg-red-900/30 hover:bg-red-800/30 rounded-lg text-sm text-red-400 transition-all const-btn"
              data-question="${i}"
            >
              False
            </button>
          </div>
        </div>
      `).join('');
      
      document.getElementById('const-total').textContent = questions.length;
    }

    function selectConstructorAnswer(index, answer, el) {
      document.querySelectorAll(`[data-question="${index}"]`).forEach(b => b.classList.remove('ring-2', 'ring-cyan-400'));
      el.classList.add('ring-2', 'ring-cyan-400');
      constructorAnswers[index] = answer;
    }

    function checkConstructorAnswers() {
      const correct = [true, true, false, false];
      let score = 0;
      
      for (let i = 0; i < 4; i++) {
        if (constructorAnswers[i] === correct[i]) {
          score++;
        }
      }
      
      document.getElementById('const-correct').textContent = score;
      
      if (score === 4) {
        completedWeeks.add(4);
        renderWeekTabs();
        updateProgress();
      }
    }

    function resetConstructorActivity() {
      initConstructorActivity();
      document.getElementById('const-correct').textContent = '0';
    }

    // Week 5: Inheritance Activity
    function inheritDragStart(e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', e.target.textContent.trim());
    }

    function inheritDragOver(e) {
      e.preventDefault();
      e.target.closest('.inherit-drop')?.classList.add('ring-2', 'ring-cyan-400');
    }

    function inheritDrop(e, type) {
      e.preventDefault();
      e.target.closest('.inherit-drop')?.classList.remove('ring-2', 'ring-cyan-400');
      
      const method = e.dataTransfer.getData('text/plain');
      const correctMappings = {
        'car': ['🚙 OpenTrunk()', '🚗 HonkHorn()'],
        'bike': ['⚙️ ChangeBike()']
      };
      
      if (correctMappings[type]?.includes(method)) {
        inheritanceAnswers[type].add(method);
        const dropZone = document.getElementById(`${type}-methods`);
        dropZone.innerHTML += `<div class="px-3 py-1 bg-green-700 rounded text-sm">${method} ✓</div>`;
        
        const sourceEl = [...document.querySelectorAll('#inherit-methods > div')].find(el => el.textContent.includes(method));
        if (sourceEl) sourceEl.style.display = 'none';
      }
    }

    function checkInheritanceAnswers() {
      const carCorrect = inheritanceAnswers.car.size === 2;
      const bikeCorrect = inheritanceAnswers.bike.size === 1;
      
      if (carCorrect && bikeCorrect) {
        document.getElementById('inherit-feedback').classList.remove('hidden');
      }
    }

    function resetInheritanceActivity() {
      inheritanceAnswers = { car: new Set(), bike: new Set() };
      document.getElementById('car-methods').innerHTML = '';
      document.getElementById('bike-methods').innerHTML = '';
      document.querySelectorAll('#inherit-methods > div').forEach(el => el.style.display = 'block');
      document.getElementById('inherit-feedback').classList.add('hidden');
    }

    // Quiz Functions
    function renderQuiz(week) {
      const quizId = `week-${week.id}`;
      if (!quizState[quizId]) {
        quizState[quizId] = {
          answers: {},
          submitted: false
        };
      }
      
      const state = quizState[quizId];
      const questions = week.content.quiz;
      
      return `
        <div class="card-gradient rounded-2xl p-6 border border-slate-600/30">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold text-white">📝 Week ${week.id} Quiz</h3>
            <span class="text-sm text-slate-400">${Object.keys(state.answers).length}/${questions.length} answered</span>
          </div>
          
          <div class="space-y-6">
            ${questions.map((q, i) => `
              <div class="bg-slate-800/50 rounded-xl p-5 ${state.submitted && state.answers[i] !== undefined ? (state.answers[i] === q.correct ? 'ring-2 ring-green-500/50' : 'ring-2 ring-red-500/50') : ''}">
                <p class="font-medium text-white mb-4">
                  <span class="text-cyan-400 mono">${i + 1}.</span> ${q.question}
                </p>
                <div class="space-y-2">
                  ${q.options.map((opt, j) => `
                    <button 
                      onclick="selectQuizAnswer('${quizId}', ${i}, ${j})"
                      class="quiz-option w-full text-left px-4 py-3 rounded-xl border-2 transition-all
                        ${state.answers[i] === j ? 'selected border-cyan-500' : 'border-slate-600'}
                        ${state.submitted && j === q.correct ? 'correct border-green-500' : ''}
                        ${state.submitted && state.answers[i] === j && j !== q.correct ? 'incorrect border-red-500' : ''}"
                      ${state.submitted ? 'disabled' : ''}
                    >
                      <span class="text-slate-400 mr-2">${String.fromCharCode(65 + j)}.</span>
                      ${opt}
                    </button>
                  `).join('')}
                </div>
                ${state.submitted && state.answers[i] !== undefined ? `
                  <div class="mt-4 p-3 rounded-lg ${state.answers[i] === q.correct ? 'bg-green-900/30' : 'bg-slate-700/50'}">
                    <p class="text-sm ${state.answers[i] === q.correct ? 'text-green-400' : 'text-slate-300'}">
                      ${state.answers[i] === q.correct ? '✓ Correct!' : '✗ ' + q.explanation}
                    </p>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
          
          <div class="mt-6 flex items-center justify-between">
            ${!state.submitted ? `
              <button 
                onclick="submitQuiz('${quizId}', ${week.id})"
                class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl font-medium hover:opacity-90 transition-all"
                ${Object.keys(state.answers).length < questions.length ? 'disabled' : ''}
              >
                Submit Quiz
              </button>
            ` : `
              <div class="flex items-center gap-4">
                <span class="text-lg font-bold ${getScorePercentage(state, questions) >= 80 ? 'text-green-400' : getScorePercentage(state, questions) >= 60 ? 'text-yellow-400' : 'text-red-400'}">
                  Score: ${calculateScore(state, questions)}/${questions.length} (${getScorePercentage(state, questions)}%)
                </span>
                ${getScorePercentage(state, questions) >= 80 ? '🏆' : getScorePercentage(state, questions) >= 60 ? '👍' : '📚'}
              </div>
              <button 
                onclick="retakeQuiz('${quizId}')"
                class="px-6 py-3 bg-slate-700 text-white rounded-xl font-medium hover:bg-slate-600 transition-all"
              >
                🔄 Retake Quiz
              </button>
            `}
          </div>
        </div>
      `;
    }

    function selectQuizAnswer(quizId, questionIndex, answerIndex) {
      if (quizState[quizId].submitted) return;
      quizState[quizId].answers[questionIndex] = answerIndex;
      loadWeekContent(currentWeek);
    }

    function submitQuiz(quizId, weekId) {
      quizState[quizId].submitted = true;
      
      const week = courseData.weeks.find(w => w.id === weekId);
      const state = quizState[quizId];
      
      if (getScorePercentage(state, week.content.quiz) >= 60) {
        completedWeeks.add(weekId);
        renderWeekTabs();
      }
      
      updateProgress();
      loadWeekContent(currentWeek);
    }

    function retakeQuiz(quizId) {
      const weekId = parseInt(quizId.split('-')[1]);
      quizState[quizId] = { answers: {}, submitted: false };
      loadWeekContent(currentWeek);
    }

    function calculateScore(state, questions) {
      return questions.filter((q, i) => state.answers[i] === q.correct).length;
    }

    function getScorePercentage(state, questions) {
      return Math.round((calculateScore(state, questions) / questions.length) * 100);
    }

    // Progress Tracking
    function updateProgress() {
      const percentage = Math.round((completedWeeks.size / courseData.weeks.length) * 100);
      document.getElementById('overall-progress').textContent = `${percentage}%`;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    // Initialize on load
    init();
  </script>
